[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-audio-node"
dynamic = ["version"]
description = "ESP32-S3 Wi-Fi speaker firmware plus a browser-based Python player that streams 48 kHz mono audio as RTP L16 over UDP, with node management and a 10-band equalizer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nadeem" }]
requires-python = ">=3.11"
keywords = ["esp32", "esp32s3", "esp-idf", "i2s", "max98357a", "rtp", "udp",
            "audio-streaming", "wifi-speaker", "flask", "equalizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "numpy",
    "imageio-ffmpeg",
    "Flask",
    "Flask-SocketIO",
    "eventlet",
    "simple-websocket",
    "requests",
]
optional-dependencies = {windows_loopback = ["pyaudiowpatch"]}

[project.scripts]
audio-player = "audio_player.app:main"

[tool.setuptools.dynamic]
version = {attr = "audio_player.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_player*"]

[tool.setuptools.package-data]
audio_player = ["templates/**/*", "static/**/*"]

[tool.setuptools]
include-package-data = true
